<style>
/* Layout: one-screen app — glass header, scrolling content, floating glass tab bar; liquid blobs drift behind frosted panels */
:root{
  --bg:#eef2f7; --text:#121722; --accent:#0a84ff; --blob1:#7dd3fc; --blob2:#f9a8d4; --blob3:#a7f3d0;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78); --edge:rgba(255,255,255,.85); --shade:rgba(20,30,60,.10);
  --muted:color-mix(in srgb,var(--text) 58%,transparent); --line:color-mix(in srgb,var(--text) 12%,transparent);
  --good:#16a34a; --bad:#dc2626; --warn:#d97706; --on-accent:#fff;
  --f-display:"Sora","SF Pro Display",system-ui,sans-serif; --f-body:"Manrope","SF Pro Text",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070a12; --text:#eef2fb; --accent:#4da3ff; --blob1:#1d4ed8; --blob2:#be185d; --blob3:#0f766e;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(28,32,44,.82); --edge:rgba(255,255,255,.16); --shade:rgba(0,0,0,.45);
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070a12; --text:#eef2fb; --accent:#4da3ff; --blob1:#1d4ed8; --blob2:#be185d; --blob3:#0f766e;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(28,32,44,.82); --edge:rgba(255,255,255,.16); --shade:rgba(0,0,0,.45);
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24; color-scheme:dark}

html,body{height:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
input,textarea,select{font-size:16px!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
.liquid{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.liquid i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.75;will-change:transform;backface-visibility:hidden;animation:drift 22s ease-in-out infinite alternate}
.liquid i:nth-child(1){background:radial-gradient(closest-side,var(--blob1),color-mix(in srgb,var(--blob1) 45%,transparent) 55%,transparent);top:-20vmax;left:-15vmax}
.liquid i:nth-child(2){background:radial-gradient(closest-side,var(--blob2),color-mix(in srgb,var(--blob2) 45%,transparent) 55%,transparent);bottom:-25vmax;right:-20vmax;animation-duration:27s}
.liquid i:nth-child(3){background:radial-gradient(closest-side,var(--blob3),color-mix(in srgb,var(--blob3) 45%,transparent) 55%,transparent);top:30%;left:35%;width:40vmax;height:40vmax;opacity:.55;animation-duration:31s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.liquid i{animation:none}}

.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--edge);box-shadow:0 10px 30px var(--shade),inset 0 1px 0 var(--edge)}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.brand h1 span{background:linear-gradient(100deg,var(--accent),var(--blob2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-row{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:28px;color:#fff;background:linear-gradient(160deg,#34d378,#0a9650);box-shadow:0 8px 20px rgba(10,150,80,.35),inset 0 1px 0 rgba(255,255,255,.45);animation:logoin .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes logoin{from{transform:scale(.4) rotate(-20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
.sync{font-size:12px;color:var(--muted);padding:6px 10px;border-radius:999px;white-space:nowrap}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 120px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.view-head h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.01em}

button,input,textarea,select{font:inherit;color:inherit}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.ghost{background:var(--glass);color:var(--text);box-shadow:none;border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.card:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.panel{border-radius:24px;padding:16px}
.search{display:flex;align-items:center;gap:8px;border-radius:16px;padding:10px 14px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:transparent}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border-radius:20px;padding:14px 16px;cursor:pointer;text-align:left;min-width:0;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}

.list{display:flex;flex-direction:column;border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .body{flex:1;min-width:0;cursor:pointer}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prio{width:4px;align-self:stretch;border-radius:4px;flex:none}
.p-hoch{background:var(--bad)}.p-mittel{background:var(--warn)}.p-niedrig{background:var(--line)}
.addline{display:flex;gap:8px;border-radius:18px;padding:6px 6px 6px 14px;align-items:center}
.addline input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:6px 0}

.cal{border-radius:24px;padding:14px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head b{font-family:var(--f-display);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wd{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day{border:0;background:transparent;border-radius:12px;padding:6px 0 8px;cursor:pointer;position:relative;font-variant-numeric:tabular-nums;font-weight:500}
.day.out{opacity:.3}
.day.today{color:var(--accent);font-weight:800}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day.has::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor;opacity:.7}
.daygroup{display:flex;flex-direction:column;gap:6px}
.daygroup>h4{margin:6px 4px 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .time{font-family:var(--f-mono);font-size:13px;min-width:48px;padding-top:2px;color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border-radius:18px;padding:12px 14px;min-width:0}
.stat small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--good)}.neg{color:var(--bad)}
.curve{border-radius:22px;padding:14px 14px 8px}
.curve svg{width:100%;height:140px;display:block}
.trade .sym{font-family:var(--f-display);font-weight:600}
.trade .pnl{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.side{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.side.long{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.side.short{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

.empty{border-radius:22px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.banner{border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}

/* settings */
.set-sec{display:flex;flex-direction:column;gap:12px}
.set-sec h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.preset{border:2px solid transparent;border-radius:18px;padding:0;cursor:pointer;overflow:hidden;background:none;text-align:left}
.preset[aria-pressed="true"]{border-color:var(--accent)}
.preset .sw{height:56px;position:relative}
.preset span{display:block;padding:6px 10px;font-size:13px;font-weight:600;background:var(--glass-strong)}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.color{display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 12px;border:1px solid var(--line)}
.color input[type=color]{width:38px;height:38px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;flex:none}
.color input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color input[type=color]::-webkit-color-swatch{border-radius:50%;border:1px solid var(--line)}
.color label{font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background-color:color-mix(in srgb,var(--bg) 40%,transparent);border-radius:14px;padding:0 14px;outline:0;width:100%;max-width:100%;min-width:0;box-sizing:border-box;display:block;margin:0;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
.field input,.field select{height:48px;line-height:46px}
.field textarea{padding:12px 14px;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.8}
.field input[type=date],.field input[type=time]{text-align:left}
.field input::-webkit-date-and-time-value{text-align:left;margin:0;min-height:46px;line-height:46px}
.field input::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer;margin:0}
.field input[type=number]{-moz-appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button,.field input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.field select{padding-right:40px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field .picks{margin-top:4px}
.field input[type=range]{height:auto;line-height:normal;border:0;background:none;padding:0;-webkit-appearance:auto;appearance:auto;box-shadow:none}
.field textarea{min-height:120px;resize:vertical}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 12px;align-items:start}
.fields .full{grid-column:1/-1}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.note-txt{font-size:13px;color:var(--muted);margin:0}

/* tabbar */
nav.tabs{position:fixed;z-index:5;left:0;right:0;margin-inline:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;border-radius:28px;padding:6px;width:min(520px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));box-sizing:border-box}
.tab{flex:1;border:0;background:transparent;border-radius:22px;padding:7px 1px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:700;min-width:0}
.tab svg.i{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--edge),0 4px 12px var(--shade)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 35%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(640px,100%);max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--edge);box-sizing:border-box;display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-size:19px}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--text)}
.seg{display:flex;border-radius:14px;padding:3px;background:var(--line);gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--text);box-shadow:0 2px 8px var(--shade)}
.toast{position:fixed;z-index:30;left:0;right:0;margin-inline:auto;width:max-content;top:calc(14px + env(safe-area-inset-top,0px));border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pick{border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 40%,transparent);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,transform .18s cubic-bezier(.3,1.4,.5,1)}
.pick:active{transform:scale(.94)}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tex-card .liquid::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.4px);background-size:5px 5px;mix-blend-mode:multiply;opacity:.9}
.tex-card .liquid i:nth-child(1){border-radius:28%;transform:rotate(-28deg)}
.pricebox{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;flex:none}
.offer-tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--bad);color:#fff;white-space:nowrap}
.offer-price{font-size:20px;font-weight:600;color:var(--good);line-height:1.2}
.normal-price{font-size:12px;color:var(--muted);white-space:nowrap}
.normal-price .mono{text-decoration:line-through}
.save{font-size:12px;color:var(--good);font-weight:600;white-space:nowrap}

/* blackjack: its own red-and-black card-table world, independent of the app theme */
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px;letter-spacing:-.01em}
nav.tabs{gap:0;padding:6px 4px}
body.bj-mode header.top{display:none}
body.bj-mode main{padding-block:8px calc(86px + env(safe-area-inset-bottom,0px))}
body.bj-mode .wrap{min-height:100%}
.bj-table{--acc:#e3263b;--acc-d:color-mix(in srgb,var(--acc) 68%,#000);--acc-l:color-mix(in srgb,var(--acc) 62%,#fff);--f1:#3d0a15;--f2:#120508;--f3:#060607;--cf1:#f0364c;--cf2:#c8162e;--cf3:#9c0f22;--inkb:#160a0c;--inkr:#fff1f3;--dot:rgba(0,0,0,.28);position:relative;flex:1;min-height:500px;overflow:hidden;border-radius:30px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px;color:#f6f1f2;background:radial-gradient(70% 40% at 50% 50%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 70%),radial-gradient(120% 70% at 50% -10%,var(--f1) 0%,var(--f2) 55%,var(--f3) 100%);border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 6px rgba(0,0,0,.35),inset 0 0 0 7px color-mix(in srgb,var(--acc) 28%,transparent)}
.bj-table::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);background-size:5px 5px;pointer-events:none}
.bj-table>*{position:relative;z-index:1}
.bj-table>.bj-fly,.bj-table>.bj-fx{position:absolute}
.bj-table.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.bj-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bj-balance small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,242,.5);font-weight:700}
.bj-balance b{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap}
.bj-tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bj-pill{font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(246,241,242,.75);white-space:nowrap;text-transform:none}
.bj-pill b{color:#fff;font-family:var(--f-mono);font-weight:500}
.bj-pill.hot{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;box-shadow:0 0 16px color-mix(in srgb,var(--acc) 50%,transparent);animation:hotpulse 1.6s ease-in-out infinite}
@keyframes hotpulse{50%{box-shadow:0 0 28px color-mix(in srgb,var(--acc) 85%,transparent)}}
.bj-ico{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(246,241,242,.7);transition:background .2s,color .2s}
.bj-ico[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 28%,transparent);color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 65%,transparent)}
.bj-ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bj-zone{display:flex;flex-direction:column;align-items:center;gap:6px}
.bj-shoe{position:absolute;right:2px;top:2px;width:38px;height:54px}
.bj-shoe i{position:absolute;inset:0;border-radius:6px;background:radial-gradient(rgba(255,255,255,.08) .8px,transparent 1.1px) 0 0/4px 4px,linear-gradient(155deg,#1e1e22,#0a0a0c);box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1)}
.bj-shoe i:nth-child(1){transform:translate(-5px,5px) rotate(-9deg)}.bj-shoe i:nth-child(2){transform:translate(-2px,2px) rotate(-4deg)}
.bj-shoe i:nth-child(3)::after{content:"\2660\FE0E";position:absolute;inset:0;display:grid;place-items:center;color:#0b0b0c;font-size:18px;text-shadow:0 1px 0 rgba(255,255,255,.14)}
.bj-hands{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.bj-hand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 8px;border-radius:18px;transition:background .3s,box-shadow .3s}
.bj-hand.on{background:color-mix(in srgb,var(--acc) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 60%,transparent)}
.bj-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,241,242,.55);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.bj-tot{font-family:var(--f-mono);font-size:13px;letter-spacing:0;color:#fff;background:rgba(255,255,255,.1);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.bj-tot.t21{background:linear-gradient(135deg,var(--acc),var(--acc-d));box-shadow:0 0 14px color-mix(in srgb,var(--acc) 65%,transparent)}
.bj-tot.over{color:rgba(246,241,242,.5);text-decoration:line-through}
.bj-res{font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(246,241,242,.8)}
.bj-res.win,.bj-res.bj{background:rgba(74,222,128,.18);color:#4ade80}
.bj-res.lose,.bj-res.bust{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc-l)}
.bj-cards{display:flex;justify-content:center;min-height:88px}
@media (max-width:500px){
  .bj-table{gap:5px}
  .bj-chip{width:46px;height:46px}
  .bj-betrow .bj-btn{padding-block:11px}
  .bj-ico{width:32px;height:32px}
  .bj-balance b{font-size:20px}
}
@media (max-width:500px) and (max-height:760px){
  .bj-table .pc{width:56px;height:80px}
  .bj-table .pc+.pc{margin-left:-27px}
  .bj-table .bj-cards{min-height:80px}
  .pc-c b{font-size:16px}
  .pc-c i{font-size:12px}
  .pc-mid{font-size:27px}
}
.pc{width:62px;height:88px;flex:none;position:relative}
.pc.flip{perspective:700px}
.pc+.pc{margin-left:-30px}
.pc-in{position:absolute;inset:0}
.pc-face{position:absolute;inset:0;border-radius:9px;overflow:hidden}
.pc-in.down .pc-face.front{display:none}
.pc.flip .pc-in{transform-style:preserve-3d}

.pc-face.back{display:none;background:radial-gradient(rgba(255,255,255,.08) .9px,transparent 1.2px) 0 0/4px 4px,linear-gradient(155deg,#1e1e22,#0a0a0c);box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.1)}

.pc-face.back::after{content:"\2660\FE0E";position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:#0b0b0c;text-shadow:0 1px 0 rgba(255,255,255,.14),0 -1px 0 rgba(0,0,0,.9)}
.pc.glow .pc-face.front{box-shadow:0 0 0 2px var(--acc-l),0 0 26px color-mix(in srgb,var(--acc) 85%,transparent)}
.pc-c{position:absolute;top:5px;left:6px;display:flex;flex-direction:column;align-items:center;line-height:1}

.pc-c.rev{top:auto;left:auto;bottom:5px;right:6px;transform:rotate(180deg)}
.pc-mid{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;text-shadow:0 1px 0 rgba(255,255,255,.2),0 -1px 1px rgba(0,0,0,.45)}
.pc.slot{border:1.5px dashed rgba(255,255,255,.13);border-radius:9px;box-sizing:border-box}
.pc.new{animation:dealin .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:var(--d,0ms)}
.bj-zone.player .pc.new{animation-name:dealinp}
.pc.flip .pc-in{animation:flip3d .7s cubic-bezier(.3,1.25,.5,1) both}
.pc-in.down .pc-face.back{display:block}
.pc.flip .pc-face.back{display:block;transform:rotateY(180deg)}
@keyframes dealin{from{opacity:0;transform:translate(150px,-40px) rotate(-28deg) scale(.7)}}
@keyframes dealinp{from{opacity:0;transform:translate(150px,-300px) rotate(-28deg) scale(.7)}}

.bj-felt{flex:1;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

.bj-banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;pointer-events:none;text-align:center}

.bj-ctrl{display:flex;flex-direction:column;gap:8px}
.bj-hint{text-align:center;font-size:12.5px;color:rgba(246,241,242,.6);min-height:18px}
.bj-hint b{color:#fff}
.bj-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bj-btn{border:0;border-radius:14px;padding:13px 6px;font-weight:700;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(160deg,var(--acc),var(--acc-d));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s cubic-bezier(.3,1.4,.5,1),opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.bj-btn.dark{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.bj-btn svg.i{width:18px;height:18px}

@keyframes recpulse{0%,100%{box-shadow:0 0 0 2px #fff,0 0 14px rgba(255,255,255,.35)}50%{box-shadow:0 0 0 2px #fff,0 0 28px rgba(255,255,255,.7)}}
.bj-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.bj-chip{width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;font-family:var(--f-mono);font-weight:700;font-size:11.5px;letter-spacing:-.03em;color:#fff;position:relative;background:var(--cc);box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 0 0 4px rgba(0,0,0,.18);transition:transform .15s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.bj-chip::before{content:"";position:absolute;inset:5px;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.c5{--cc:#ece6e3}.bj-chip.c5{color:var(--acc-d)}.c5::before{border-color:rgba(163,16,31,.55)!important}
.cmax{--cc:linear-gradient(145deg,#ffe07a,#d99a00);color:#3a2600!important;font-weight:900!important}.c10{--cc:#3a3a42}.c25{--cc:#d81f35}.c100{--cc:#111}.c100::before{border-color:color-mix(in srgb,var(--acc) 85%,transparent)!important}.c500{--cc:#6b0d1a}.c1000{--cc:#12a150}.c1000::before{border-color:rgba(255,255,255,.7)!important}.bj-chip.c1000{font-size:10px;letter-spacing:-.06em}.c10000{--cc:#1aa7ec;background:radial-gradient(circle at 35% 30%,#bff0ff 0,#4fd0ff 30%,#1688d6 70%,#0b5fa8 100%)!important}.c10000::before{border-color:rgba(255,255,255,.85)!important}.bj-chip.c10000{font-size:10px;letter-spacing:-.06em;text-shadow:0 1px 2px rgba(0,40,90,.7);box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 14px rgba(79,208,255,.55),inset 0 0 0 4px rgba(0,0,0,.15)}
.bj-chip:disabled{opacity:.22;cursor:not-allowed}
.bj-chip:not(:disabled):active{transform:translateY(-5px) scale(.94)}
.bj-btn:focus-visible,.bj-chip:focus-visible,.bj-ico:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bj-betrow{display:grid;grid-template-columns:52px 52px 52px 1fr;gap:6px}
.bj-max{color:#ffd84a!important;font-weight:900;letter-spacing:.02em}
.bj-table:not(.rl):not(.sl) .bj-foot{display:none}
.bj-foot{text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,241,242,.3)}

.bj-fx{inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){.pc.new,.pc.flip .pc-in,.bj-banner.show,.sc.drop,.bj-btn.rec,.bj-pill.hot,.bj-table.shake,.pc-face.front::after{animation:none!important}}

.fb-wrap.full{position:fixed;inset:0;z-index:500;background:#000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.ok{display:flex;flex-direction:column;gap:10px}

.ok-rack .ok-t,.ok-slot{cursor:pointer}

.ok-rack{display:grid;grid-template-columns:repeat(12,var(--w));--w:clamp(24px,calc((100cqw - 40px)/12 - 3px),46px);justify-content:center;gap:5px 3px;padding:10px 6px 12px;border-radius:14px;background:linear-gradient(180deg,#7a4a24,#5a3315 55%,#3f230d);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),inset 0 -4px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.45)}

.ok-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:hsl(var(--h) 65% 45%);flex:none}

.ok-empty{width:34px;height:46px;border-radius:6px;border:2px dashed rgba(255,255,255,.18)}
.ok-pile.can{cursor:pointer;border-radius:10px;box-shadow:0 0 0 3px var(--acc),0 0 18px color-mix(in srgb,var(--acc) 60%,transparent);animation:okPulse 1.2s ease-in-out infinite}

.ok-ind{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.75);font-size:10.5px;font-weight:700;text-align:center}

.ok-end{border-radius:16px;padding:14px;text-align:center;background:rgba(0,0,0,.45);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);animation:okIn .35s ease-out}

.ok-intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 6px;color:#fff;flex:1;justify-content:center}

.ok-intro p{margin:0;max-width:440px;font-size:13px;opacity:.85;line-height:1.45}

.ok-logo{display:flex;gap:6px}.ok-logo .ok-t{--w:40px;transform:rotate(calc(var(--r,0)*1deg))}

.ok-max{color:#ffd84a}.ok-max[aria-pressed=true]{background:linear-gradient(145deg,#ffe07a,#d99a00);color:#3a2600}
.ok-start{min-width:220px}
.ok-help{min-width:220px;font-size:14px}
.ok-q{width:22px;height:22px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-weight:900;font-size:13px;cursor:pointer;margin-right:4px;vertical-align:middle}
@container (min-width:700px){.ok-pile .ok-t,.ok-pile{--w:42px}.ok-opp b{font-size:15px}.ok-status{font-size:14px}}
.wf-view{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:1000px;margin:0 auto;width:100%}
.wf-top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px}

const queue=new Map(), busy=new Set();
function persist(id,body){ // body null = delete
  saveLocal();
  if(!coll)return;
  queue.set(id,body);
  clearTimeout(persist.t);persist.t=setTimeout(flush,500);
}
async function flush(){
  for(const [id,body] of [...queue]){
    if(busy.has(id))continue;
    queue.delete(id);busy.add(id);setSync('Speichert…');
    try{const ref=coll.doc(id);body===null?await ref.delete():await ref.set(JSON.parse(JSON.stringify(body)));}
    catch(e){setSync('Nicht gespeichert');toast('Speichern fehlgeschlagen. Bitte Verbindung prüfen.');}
    busy.delete(id);
  }
  if(queue.size){setTimeout(flush,300)}else setSync(online?'Synchronisiert':'Auf diesem Gerät');
}

async function connect(){
  try{await connectInner()}finally{connecting=false;if(tab==='angebote')render()}

async function connectInner(){
  const cl=window.claude;
  if(!cl||!cl.use){setSync('Auf diesem Gerät');return}
  let timer;const timeout=new Promise(r=>timer=setTimeout(()=>r(null),10000));
  try{
    const res=await Promise.race([Promise.all([cl.use('db'),cl.use('user')]),timeout]);clearTimeout(timer);
    if(!res||!res[0]||!res[1]){setSync('Auf diesem Gerät');return}
    const id=await res[1].id(); if(!id){setSync('Auf diesem Gerät');return}
    db=res[0]; coll=db.collection('data/users/'+id);
    const snap=await coll.get();
    online=true;
    res[1].canEdit().then(v=>{CAN_EDIT=!!v;if(tab==='angebote')render()}).catch(()=>{});
    try{db.doc('offers/watchlist').onSnapshot(s=>{const d=s.exists?s.data():null;WATCH=d&&Array.isArray(d.items)?d.items.slice():null;if(tab==='angebote')render()},()=>{})}catch(e){}
    try{db.doc('offers/current').onSnapshot(s=>{const prev=OFFERS;OFFERS=s.exists?s.data():null;if(SEARCHING&&prev&&OFFERS!==prev){SEARCHING=0;clearTimeout(refreshNow.w);toast('Angebote aktualisiert')}offersState=s.exists?'ok':'leer';if(tab==='angebote')render()},()=>{offersState='fehler';if(tab==='angebote')render()})}catch(e){offersState='fehler'}
    if(snap.empty){
      // first visit with an account: keep anything already on this device, otherwise start with examples
      if(!KINDS.some(k=>S[k].length))seedExamples();
      persistAll();
    }else{
      KINDS.forEach(k=>S[k]=[]);S.settings=defaultSettings();
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='settings'){const {kind,...rest}=JSON.parse(JSON.stringify(v));S.settings=Object.assign(defaultSettings(),rest);cacheSettings()}else if(S[v.kind])S[v.kind].push(JSON.parse(JSON.stringify(v)))});
      saveLocal();
    }
    setSync('Synchronisiert');applyTheme();render();
  }catch(e){clearTimeout(timer);db=null;coll=null;setSync('Auf diesem Gerät')}
}

const isDesk=()=>!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches);
function autoZoom(){if(!isDesk())return 100;return innerWidth>=1500&&innerHeight>=850?120:innerWidth>=1000?110:100}
function curZoom(){return S.settings.uiZoom||autoZoom()}
function lum(hex){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;const f=c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function currentColors(){const s=S.settings;if(s.custom)return s.custom;const p=PRESETS[s.preset];return p&&p.v}
function applyTheme(){
  const root=document.documentElement, st=root.style;
  ['--bg','--text','--accent','--blob1','--blob2','--blob3','--glass','--glass-strong','--edge','--shade','--on-accent','color-scheme'].forEach(p=>st.removeProperty(p));
  const c=currentColors();
  const pr=PRESETS[S.settings.preset];
  root.classList.toggle('tex-card',!S.settings.custom&&!!(pr&&pr.tex===true));
  root.classList.toggle('tex-gold',!S.settings.custom&&!!(pr&&pr.tex==='gold'));
  if(c){
    const dark=lum(c.bg)<.2;
    st.setProperty('--bg',c.bg);st.setProperty('--text',c.text);st.setProperty('--accent',c.accent);
    st.setProperty('--blob1',c.blob1);st.setProperty('--blob2',c.blob2);st.setProperty('--blob3',c.blob3);
    st.setProperty('--glass',dark?'rgba(255,255,255,.07)':'rgba(255,255,255,.55)');
    st.setProperty('--glass-strong',dark?'color-mix(in srgb,'+c.bg+' 82%,#ffffff 6%)':'rgba(255,255,255,.8)');
    st.setProperty('--edge',dark?'rgba(255,255,255,.16)':'rgba(255,255,255,.85)');
    st.setProperty('--shade',dark?'rgba(0,0,0,.45)':'rgba(20,30,60,.10)');
    st.setProperty('--on-accent',lum(c.accent)>.45?'#111':'#fff');
    st.setProperty('color-scheme',dark?'dark':'light');
  }
  document.querySelectorAll('.glass,.sheet').forEach(()=>{});
  const blur=S.settings.blur??26;
  document.querySelector('style#dyn')?.remove();
  const sd=document.createElement('style');sd.id='dyn';
  sd.textContent=`.glass{backdrop-filter:blur(${blur}px) saturate(180%);-webkit-backdrop-filter:blur(${blur}px) saturate(180%)}`+(S.settings.motion?'':'.liquid i{animation:none}');
  const uz=S.settings.uiZoom;
  if(uz&&isDesk()){const z=uz/100;sd.textContent+=`header.top,.wrap,nav.tabs,.sheet,.toast{zoom:${z}}main{padding-bottom:${Math.round(125*z)}px}body.bj-mode main{padding-bottom:${Math.round(95*z)}px}body.bj-mode .wrap{min-height:calc(100% / ${z})}`}
  document.body.appendChild(sd);
}

function renderTabs(){
  const nav=$('#tabs'),V=visTabs();
  /* settings may arrive after the first paint: rebuild the bar when the visible tabs changed, and never stay on a hidden tab */
  if(!V.some(x=>x[0]===tab))tab=V[0][0];
  if(nav.children.length&&[...nav.querySelectorAll('.tab')].map(b=>b.dataset.tab).join()!==V.map(x=>x[0]).join())nav.innerHTML='';
  if(nav.children.length){nav.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===tab;if(b.getAttribute('aria-selected')!==String(on))b.setAttribute('aria-selected',on)});return}

}
function money(v){const c=S.settings.currency||'€';const s=Math.abs(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});return (v<0?'−':v>0?'+':'')+s+' '+c}

/* ---------- views ---------- */
function render(){
  renderTabs();
  document.body.classList.toggle('bj-mode',tab==='blackjack');
  document.body.classList.toggle('rl-mode',tab==='blackjack'&&czGame()==='roulette');
  if(tab!=='blackjack'&&tab!=='bird'&&tab!=='rad'&&typeof releaseAudio==='function')releaseAudio();
  $('#today-label').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const v=$('#view');
  /* the entrance animation is only for switching sections; without this, every re-render faded the content in again */
  if(!animNext)v.classList.remove('enter');
  const mainEl=$('#main'),keepY=!animNext&&mainEl?mainEl.scrollTop:null;
  /* hold the old height while the section is swapped, so Safari never sees a short page and jumps to the top */
  if(keepY!=null)v.style.minHeight=v.offsetHeight+'px';
  try{v.innerHTML=({notizen:vNotes,todos:vTodos,termine:vEvents,trading:vTrades,angebote:vOffers,blackjack:vCasino,bird:vBird,rad:vWheel,block:vBlocks,chat:vChat,updates:vUpdates,optionen:vSettings}[tab])()}
  catch(err){console.error(err);v.innerHTML=`<div class="empty glass"><b>Dieser Bereich konnte nicht geladen werden</b>${esc(err&&err.message||'Unbekannter Fehler')}</div>`}
  /* keep the scroll position when a tap re-renders the same section */
  if(keepY!=null){if(mainEl.scrollTop!==keepY)mainEl.scrollTop=keepY;const rk=render.k=(render.k||0)+1;requestAnimationFrame(()=>{if(render.k===rk){if(!render.jump&&Math.abs(mainEl.scrollTop-keepY)>2)mainEl.scrollTop=keepY;v.style.minHeight=''}render.jump=false})}else v.style.minHeight='';
  if(animNext&&S.settings.motion){
    v.classList.remove('enter');void v.offsetWidth;
    [...v.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,8)));
    v.querySelectorAll('.grid>.card,.list>.row,.stats>.stat').forEach((c,i)=>{c.classList.add('pop-in');c.style.setProperty('--j',Math.min(i,10))});
    v.classList.add('enter');
    v.querySelectorAll('.curve polyline').forEach(p=>p.classList.add('draw'));
    v.querySelectorAll('.stat b[data-num]').forEach(countUp);
  }
  if(tab==='chat')chFit();
  if(tab==='rad')wfFit();
  document.body.classList.toggle('bw-on',tab==='block');if(tab==='block')bwFit();
  if(tab==='bird')fbMount();else if(typeof fbStop==='function')fbStop();
  animNext=false;
  if(popId){const c=v.querySelector(`.check[data-id="${popId}"]`);c&&c.classList.add('pop');popId=null}
}
function countUp(el){const end=+el.dataset.num,fmt=el.dataset.fmt;const t0=performance.now(),D=700;
  const f=n=>fmt==='money'?money(n):fmt==='pct'?Math.round(n)+' %':n.toLocaleString('de-DE',{maximumFractionDigits:2});
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=f(end*e);if(k<1)requestAnimationFrame(step);else el.textContent=f(end)};requestAnimationFrame(step)}

function pnl(x){if(x.exit===''||x.exit==null||isNaN(+x.exit))return null;const d=x.side==='short'?(+x.entry-+x.exit):(+x.exit-+x.entry);return d*(+x.qty||0)*(+x.cs||1)-(+x.fees||0)}
function csFor(sym){const v=String(sym||'').toUpperCase().replace(/\s/g,'');if(/^(XAU|GOLD)/.test(v))return 100;if(/^(XAG|SILVER)/.test(v))return 5000;if(/^[A-Z]{3}\/?[A-Z]{3}$/.test(v)&&!/^(BTC|ETH|SOL|XRP)/.test(v)&&!/USDT$/.test(v))return 100000;return 1}
function vTrades(){
  const tr=S.trade.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const closed=tr.filter(x=>pnl(x)!==null);
  const total=closed.reduce((s,x)=>s+pnl(x),0);
  const wins=closed.filter(x=>pnl(x)>0), losses=closed.filter(x=>pnl(x)<0);
  const wr=closed.length?Math.round(wins.length/closed.length*100):0;
  const gw=wins.reduce((s,x)=>s+pnl(x),0), gl=Math.abs(losses.reduce((s,x)=>s+pnl(x),0));
  const pf=gl?(gw/gl).toLocaleString('de-DE',{maximumFractionDigits:2}):(gw?'∞':'–');
  const avg=closed.length?total/closed.length:0;
  // equity curve
  const asc=closed.slice().sort((a,b)=>a.date.localeCompare(b.date));let cum=0;const pts=[0,...asc.map(x=>cum+=pnl(x))];
  const W=600,H=140,P=12;const mn=Math.min(0,...pts),mx=Math.max(0,...pts),rng=(mx-mn)||1;
  const X=i=>P+(pts.length>1?i*(W-2*P)/(pts.length-1):0), Y=v=>H-P-(v-mn)*(H-2*P)/rng;
  const line=pts.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const col=total>=0?'var(--good)':'var(--bad)';
  const curve=pts.length>1?`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Kapitalkurve">
    <line x1="${P}" x2="${W-P}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 4" fill="none"/>
    <polygon points="${X(0)},${Y(0)} ${line} ${X(pts.length-1)},${Y(0)}" fill="${col}" opacity=".14"/>
    <polyline pathLength="1" points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1])}" r="5" fill="${col}"/></svg>`:'<p class="note-txt">Die Kapitalkurve erscheint nach dem ersten abgeschlossenen Trade.</p>';
  return `<div class="view-head"><h2>Trading Journal</h2><button class="btn" data-act="new-trade">${ic('plus')}Trade</button></div>
  <div class="stats">
    <div class="stat glass"><small>Gesamt P&amp;L</small><b class="${total>0?'pos':total<0?'neg':''}" data-num="${total}" data-fmt="money">${money(total)}</b></div>
    <div class="stat glass"><small>Trefferquote</small><b data-num="${wr}" data-fmt="pct">${wr} %</b></div>
    <div class="stat glass"><small>Profit-Faktor</small><b>${pf}</b></div>
    <div class="stat glass"><small>Ø pro Trade</small><b class="${avg>0?'pos':avg<0?'neg':''}">${money(avg)}</b></div>
  </div>
  <div class="curve glass"><div class="meta" style="justify-content:space-between"><span>Kapitalkurve · ${closed.length} Trades</span><span>${wins.length} Gewinne · ${losses.length} Verluste</span></div>${curve}</div>
  ${exampleBanner('trade','Trades')}
  ${tr.length?`<div class="list glass">${tr.map(x=>{const p=pnl(x);return `<div class="row trade" data-act="edit-trade" data-id="${x.id}" role="button" tabindex="0" style="cursor:pointer">
    <div class="body"><div class="meta"><span class="sym" style="color:var(--text);font-size:15px">${esc(x.symbol)}</span><span class="side ${x.side}">${x.side==='short'?'SHORT':'LONG'}</span>${x.example?'<span class="badge">Beispiel</span>':''}</div>
    <div class="meta">${fmtShort(x.date)}${x.setup?' · '+esc(x.setup):''}${x.mood?' · '+esc(x.mood):''}</div></div>
    <div class="pnl ${p>0?'pos':p<0?'neg':''}">${p===null?'<span class="badge">Offen</span>':money(p)}</div></div>`}).join('')}</div>`
  :`<div class="empty glass"><b>Noch keine Trades</b>Tippe auf „Trade“, um deinen ersten Trade mit Ein- und Ausstieg festzuhalten.</div>`}`;

let KEEP=null;
/* iOS ignores the ring/silent switch only for "playback" audio: set the audio session and keep a near-silent media loop running while the table is open */
function unlockAudio(){
  const a=audio();if(!a)return;loadSamples();
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!KEEP){KEEP=document.createElement('audio');KEEP.src=SILENT;KEEP.loop=true;KEEP.preload='auto';KEEP.setAttribute('playsinline','');KEEP.setAttribute('x-webkit-airplay','deny');KEEP.volume=1}
    if(KEEP.paused){const pr=KEEP.play();pr&&pr.catch(()=>{})}}catch(e){}
  if(!audioOK){try{const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0);audioOK=true}catch(e){}}
}
function releaseAudio(){
  try{if(KEEP&&!KEEP.paused)KEEP.pause()}catch(e){}
  try{if(navigator.audioSession&&navigator.audioSession.type==='playback')navigator.audioSession.type='auto'}catch(e){}
}

const SL_POOL=[['7',1],['BAR',2],['A',3],['♠',4],['♥',4],['♦',4],['♣',4],['F',2]].flatMap(([s,w])=>Array(w).fill(s));

async function chAsk(q){

        const hist=CH.msgs.slice(1,-1).slice(-10).map(m=>({role:m.r==='me'?'user':'assistant',content:m.t||'…'}));
        while(hist.length&&hist[0].role!=='user')hist.shift();
        if(hist.length)hist[0]={role:'user',content:CH_RULES+'\n\nFrage des Nutzers: '+hist[0].content};

        const r=await chSample(hist,{modelTier:'quick',cache:false,signal:CH.ctl.signal,onText:({text})=>{bot.typing=false;bot.t=text;chPaint()}});

}

/* ---------- Umzug Claude-Version → GitHub-Version: alle Daten gepackt in der Adresse mitgeben ---------- */
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function lwPack(){const raw=new TextEncoder().encode(JSON.stringify({v:1,at:Date.now(),note:S.note,todo:S.todo,event:S.event,trade:S.trade,settings:S.settings}));
  const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));return b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}
async function lwUnpack(code){const ds=new Blob([ub64(code)]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}

async function lwCopy(){try{const code='LW1:'+await lwPack();try{await navigator.clipboard.writeText(code);toast('Daten kopiert. Jetzt in der App unter Optionen → Speicher einfügen.')}catch(e){const t=document.getElementById('lw-code');if(t){t.value=code;t.select();try{document.execCommand('copy');toast('Daten kopiert.')}catch(x){toast('Markiere den Code und kopiere ihn.')}}}}catch(e){toast('Kopieren hat nicht geklappt.')}}
async function lwApply(d){if(!d||d.v!==1)throw new Error('Format');KINDS.forEach(k=>S[k]=Array.isArray(d[k])?d[k]:[]);S.settings=Object.assign(defaultSettings(),d.settings||{});saveLocal();cacheSettings();applyTheme();render();toast('Alle Daten übernommen: '+S.note.length+' Notizen, '+S.trade.length+' Trades.')}
async function lwPaste(fromClip){let raw='';const t=document.getElementById('lw-code');
  if(fromClip){try{raw=await navigator.clipboard.readText()}catch(e){toast('Kein Zugriff auf die Zwischenablage. Füge den Code ins Feld ein (Strg+V).');return}}else raw=t?t.value:'';
  raw=String(raw||'').trim();const m=/lwimport=([A-Za-z0-9_-]+)/.exec(raw)||/^LW1:([A-Za-z0-9_-]+)$/.exec(raw);

async function ghImportFromHash(){
  const m=/^#lwimport=([A-Za-z0-9_-]+)/.exec(location.hash||'');if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}

    const has=KINDS.some(k=>S[k].length&&S[k].some(x=>!x.example));

    <p class="note-txt">Ergebnis = Kursdifferenz × Lotsize × Kontraktgröße − Gebühren. Forex-Paare: 100000, Gold: 100, Indizes und Aktien meist 1. Prüf die Werte bei deinem Broker.</p>
    <p class="note-txt mono" id="f-pnl"></p>`,
  ()=>{const sym=val('f-sym').trim().toUpperCase();if(!sym){toast('Gib ein Symbol ein.');return false}if(val('f-entry')===''){toast('Gib den Einstiegspreis ein.');return false}

    if(isNew)S.trade.push(x);saveItem(x);toast('Trade gespeichert')},

  sheetData.side=x.side;

  sheetData.csTouched=x.cs!=null;

}

/* ---------- calendar export (.ics) ---------- */
function icsDate(date,time){return date.replace(/-/g,'')+'T'+time.replace(':','')+'00'}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m)}
async function exportIcs(e){
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let dt;
  if(e.time){const s=new Date(e.date+'T'+e.time);const en=new Date(s.getTime()+(e.dur||60)*60000);
    dt=`DTSTART:${icsDate(e.date,e.time)}\r\nDTEND:${icsDate(ymd(en),pad(en.getHours())+':'+pad(en.getMinutes()))}`}
  else dt=`DTSTART;VALUE=DATE:${e.date.replace(/-/g,'')}\r\nDTEND;VALUE=DATE:${addDays(e.date,1).replace(/-/g,'')}`;
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Larsens World//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:${e.id}@larsensworld`,`DTSTAMP:${now}`,dt,`SUMMARY:${icsEsc(e.title)}`,
    e.place?`LOCATION:${icsEsc(e.place)}`:'',e.note?`DESCRIPTION:${icsEsc(e.note)}`:'','BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(e.title)}`,'END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const name=(e.title||'Termin').replace(/[^\wäöüÄÖÜß -]/g,'').trim().replace(/\s+/g,'-')+'.ics';
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){const u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Datei öffnen und „Hinzufügen“ tippen');return}
    await dl.save({filename:name,data:new Blob([ics],{type:'text/calendar'})});
    toast('Datei öffnen und „Hinzufügen“ tippen');
  }catch(err){if(err&&err.code==='unavailable')toast('Kalender-Export ist in dieser Ansicht nicht verfügbar.');}
}

    case'cal-day':calSel=calSel===el.dataset.d?null:el.dataset.d;if(calSel)calMonth=calSel.slice(0,7);render();break;
    case'cal-all':calSel=null;render();break;
    case'new-trade':editTrade();break;
    case'edit-trade':editTrade(find('trade'));break;
    case'clear-examples':{const k=el.dataset.kind;S[k].filter(x=>x.example).forEach(x=>persist(x.id,null));S[k]=S[k].filter(x=>!x.example);render();toast('Beispiele gelöscht');break}
    case'preset':S.settings.preset=el.dataset.k;S.settings.custom=null;S.settings.czTheme='auto';applyTheme();saveSettings();render();break;
    case'bj-chip':{if(BJ.phase==='play'||BJ.phase==='dealer')break;const v=+el.dataset.v;if(BJ.bet+v>bjS().bal){toast('Nicht genug Guthaben');break}BJ.bet+=v;BJ.msg='';BJ.dropNew=true;sfx('chip');bjRender();flyChip(v);break}
    case'bj-x2':{if(BJ.phase==='play'||BJ.phase==='dealer')break;if(BJ.bet&&BJ.bet*2<=bjS().bal){BJ.bet*=2;BJ.msg='';BJ.dropNew=true;sfx('stack');bjRender()}break}
    case'bj-max':{if(BJ.phase==='play'||BJ.phase==='dealer')break;const b=Math.floor(bjS().bal);if(b<1){toast('Kein Guthaben zum Setzen.');break}BJ.bet=b;BJ.msg='';BJ.dropNew=true;sfx('stack');bjRender();toast('Alles drin: '+fmtC(b));break}
    case'bj-clear':sfx('tap');BJ.bet=0;BJ.msg='';bjRender();break;
    case'bj-deal':bjDeal();break;
    case'bj-hit':bjHit();break;
    case'bj-stand':bjStand();break;
    case'bj-double':bjDouble();break;
    case'bj-split':bjSplit();break;
    case'bj-hint':{const s=bjS();s.hint=!s.hint;saveSettings();bjRender();toast(s.hint?'Strategie-Tipps an':'Strategie-Tipps aus');break}
    case'bj-sound':{const s=bjS();s.sound=!s.sound;saveSettings();bjRender();if(s.sound){unlockAudio();sfx('chip')}else releaseAudio();toast(s.sound?'Ton an':'Ton aus');break}
    case'bj-refill':{const s=bjS();BJ.balFrom=s.bal;s.bal+=1000;saveSettings();sfx('refill');toast('1.000\u00a0\u20ac nachgef\u00fcllt');bjRender();break}
    case'ui-zoom':{const z=Math.min(160,Math.max(70,curZoom()+(+el.dataset.d)));S.settings.uiZoom=z;applyTheme();saveSettings();render();break}
    case'ui-zoom-auto':S.settings.uiZoom=null;applyTheme();saveSettings();render();toast('Größe passt sich wieder automatisch an');break;
    case'fb-start':fbStart();break;
    case'fb-resume':fbResume();break;
    case'fb-pause':if(FB.state==='play'){FB.state='pause';fbOverlay();saveSettings()}break;
    case'fb-menu':{if(FB.state==='pause'){const b=fbS();if(FB.score>b.best)b.best=FB.score;b.earned=(b.earned||0)+FB.money;b.runs=(b.runs||0)+1;saveSettings()}FB.state='menu';fbReset();fbOverlay();const be=$('#fb-best');if(be)be.textContent=fbS().best;break}
    case'fb-style':fbS().style=el.dataset.k;saveSettings();fbOverlay();break;
    case'fb-col':{const b=fbS();b.colors=Object.assign({},b.colors||{});if(el.dataset.c)b.colors[b.char]=el.dataset.c;else delete b.colors[b.char];saveSettings();fbOverlay();break}
    case'fb-full':fbFull();break;
    case'fb-map':fbS().map=el.dataset.k;saveSettings();render();break;

    case'ch-q':chAsk(el.dataset.q);break;
    case'ch-clear':if(CH.ctl)try{CH.ctl.abort()}catch(e){}CH.msgs=[{r:'bot',t:CH_HELLO}];CH.busy=false;chPaint();break;
    case'ch-copy':{const done=()=>toast('E-Mail kopiert');try{navigator.clipboard.writeText(CHAT_MAIL).then(done,()=>{prompt('E-Mail:',CHAT_MAIL)})}catch(e){prompt('E-Mail:',CHAT_MAIL)}break}
    case'ch-preset':chS().preset=el.dataset.k;chS().acc=null;saveSettings();render();break;

    case'ok-max':{const b=Math.floor(bjS().bal);if(b<1){toast('Kein Guthaben zum Setzen.');break}OK.stake=b;sfx('stack');bjRender();break}
    case'ok-stake':OK.stake=+el.dataset.v;sfx('chip');bjRender();break;
    case'ok-new':okNew();break;
    case'ok-intro':OK.phase='intro';bjRender();break;
    case'ok-deck':okDraw('deck');break;
    case'ok-take':okDraw('disc');break;
    case'ok-disc':okDiscard();break;
    case'ok-slot':okSlot(+el.dataset.i);break;
    case'ok-sort':okArrange(el.dataset.m);break;
    case'ok-finish':okFinishNow();break;
    case'cz-game':{const g=el.dataset.g;if(g===czGame()||czBusy())break;S.settings.casinoGame=g;saveSettings();animNext=true;sfx('tap');render();break}

    case'cz-cards':S.settings.czCards=el.dataset.k;saveSettings();render();break;

});
